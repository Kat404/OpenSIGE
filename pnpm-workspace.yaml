  - ai@7.0.169 || 7.0.182
  - "@ai-sdk/openai-compatible@3.0.90 || 3.0.95"
  - "@sveltejs/kit@3.2.0 || 3.4.1"
  - "@cloudflare/workers-types@5.20261110.1 || 5.20261125.1"
  - "@ai-sdk/gateway@4.0.142 || 4.0.155"
  - "@ai-sdk/provider-utils@5.0.79 || 5.0.84"
  - "@cloudflare/workerd-darwin-64@1.20261110.1"
  - "@cloudflare/workerd-darwin-arm64@1.20261110.1"
  - "@cloudflare/workerd-linux-64@1.20261110.1"
